name: Verify Microsoft Emails

on:
  workflow_dispatch: 

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: pip install dnspython
        
      - name: 运行验证脚本
        run: python verify.py
        
      - name: 上传结果文件
        uses: actions/upload-artifact@v4
        with:
          name: 验证结果
          path: result.txt
